<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BlurryVision AI</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  background:#08090d;
  color:#f7f7fa;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button,input{font:inherit}

.app{
  width:100%;
  max-width:920px;
  min-height:100vh;
  margin:auto;
  background:#0c0e14;
}

header{
  height:68px;
  padding:0 20px;
  border-bottom:1px solid #242732;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:5;
  background:rgba(12,14,20,.92);
  backdrop-filter:blur(15px);
}

.logo{
  font-size:21px;
  font-weight:800;
}

.logo span{
  background:linear-gradient(90deg,#bd82ff,#ff75ac);
  -webkit-background-clip:text;
  color:transparent;
}

.badge{
  color:#c5a7ff;
  border:1px solid #392d4e;
  background:#17131f;
  padding:7px 10px;
  border-radius:20px;
  font-size:11px;
}

.hero{
  text-align:center;
  padding:60px 20px 35px;
}

.eyebrow{
  display:inline-block;
  color:#c59cff;
  background:#17121e;
  border:1px solid #342644;
  border-radius:30px;
  padding:8px 13px;
  font-size:12px;
  margin-bottom:18px;
}

.hero h1{
  font-size:clamp(40px,8vw,70px);
  line-height:1.02;
  letter-spacing:-2px;
}

.gradient{
  background:linear-gradient(90deg,#c084fc,#f472b6);
  -webkit-background-clip:text;
  color:transparent;
}

.hero p{
  max-width:630px;
  margin:18px auto 0;
  color:#9299a8;
  line-height:1.65;
}

.characters{
  padding:20px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.card{
  background:#11141b;
  border:1px solid #272b35;
  border-radius:18px;
  padding:18px;
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
  border-color:#4b3a5e;
}

.avatar{
  height:145px;
  border-radius:14px;
  display:grid;
  place-items:center;
  font-size:55px;
  background:linear-gradient(145deg,#25152f,#171a27);
  margin-bottom:15px;
}

.card h3{
  margin-bottom:7px;
}

.card p{
  color:#858c9a;
  font-size:13px;
  line-height:1.5;
  min-height:40px;
}

.start{
  width:100%;
  border:0;
  border-radius:10px;
  padding:11px;
  margin-top:15px;
  background:#fff;
  color:#08090d;
  font-weight:700;
  cursor:pointer;
}

.start:hover{
  background:#eee;
}

.info{
  text-align:center;
  color:#687080;
  font-size:12px;
  padding:15px 20px 40px;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:14px;
  background:rgba(0,0,0,.78);
  z-index:20;
}

.modal.open{
  display:flex;
}

.chat{
  width:100%;
  max-width:550px;
  height:min(720px,94vh);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:#10131a;
  border:1px solid #303440;
  border-radius:20px;
}

.chat-head{
  min-height:70px;
  padding:13px 16px;
  display:flex;
  align-items:center;
  gap:11px;
  border-bottom:1px solid #292d37;
}

.small-avatar{
  width:44px;
  height:44px;
  border-radius:13px;
  display:grid;
  place-items:center;
  background:#251730;
  font-size:22px;
}

.character-name{
  font-weight:750;
}

.status{
  margin-top:3px;
  color:#687181;
  font-size:11px;
}

.online{
  color:#55d892;
}

.close{
  margin-left:auto;
  border:0;
  background:none;
  color:#9298a4;
  font-size:27px;
  cursor:pointer;
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:18px;
  scroll-behavior:smooth;
}

.msg{
  max-width:84%;
  margin-bottom:15px;
  line-height:1.55;
  font-size:14px;
}

.bubble{
  padding:12px 14px;
  border-radius:15px;
}

.ai .bubble{
  background:#1a1d26;
  border-bottom-left-radius:5px;
  color:#e4e6ec;
}

.user{
  margin-left:auto;
}

  background:linear-gradient(135deg,#713aa1,#a548
