<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SpicyChat.ai — Web App</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>

<body class="bg-[#0b0e14] text-gray-100 font-sans min-h-screen flex flex-col">

<header class="sticky top-0 z-40 bg-[#0b0e14]/90 backdrop-blur-md border-b border-[#222b3d] px-4 lg:px-8 h-16 flex items-center justify-between">

  <div class="flex items-center gap-4">

    <a href="#"
      class="text-xl font-black tracking-tight flex items-center gap-2">

      <span class="bg-gradient-to-r from-purple-500 to-pink-500 text-transparent bg-clip-text">
        SpicyChat
      </span>

      <span class="text-xs bg-purple-950 border border-purple-800 text-purple-300 px-2 py-0.5 rounded-full font-semibold">
        AI v4.0
      </span>

    </a>

  </div>

  <div class="flex items-center gap-3">

    <div class="flex items-center gap-1.5 bg-[#121721] border border-[#222b3d] px-2.5 py-1.5 rounded-full">

      <span class="text-[11px] font-bold text-pink-400 tracking-wider">
        NSFW
      </span>

      <button
        id="nsfwToggle"
        onclick="toggleNsfw()"
        aria-label="Toggle NSFW"
        class="w-8 h-4.5 bg-pink-600 rounded-full relative transition flex items-center px-0.5 cursor-pointer">

        <div
          id="nsfwThumb"
          class="w-3.5 h-3.5 bg-white rounded-full transition-transform transform translate-x-3.5">
        </div>

      </button>

    </div>

    <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-purple-600 to-pink-600 flex items-center justify-center font-bold text-xs text-white shadow">
      DF
    </div>

  </div>

</header>


<main class="flex-1 max-w-7xl w-full mx-auto px-4 lg:px-8 py-6 flex flex-col gap-6">

  <section class="flex flex-col gap-4">

    <div>

      <h1 class="text-2xl md:text-3xl font-black tracking-tight">
        Explore AI Characters
      </h1>

      <p class="text-sm text-gray-400 mt-1">
        Immerse yourself in dynamic, human-like conversations and multilingual roleplay.
      </p>

    </div>

    <div class="relative w-full">

      <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>

      <input
        id="searchInput"
        type="text"
        placeholder="Search characters..."
        oninput="filterCharacters()"
        class="w-full bg-[#121721] border border-[#222b3d] rounded-xl pl-10 pr-4 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-purple-500 transition">

    </div>

    <div id="tagFilters"
      class="flex items-center gap-2 overflow-x-auto pb-2 text-xs font-semibold">

      <button
        onclick="filterByTag('All', this)"
        class="tag-btn whitespace-nowrap px-4 py-2 rounded-xl bg-purple-600 text-white transition shadow-sm">

        🔥 All

      </button>

      <button
        onclick="filterByTag('Mami / Shashuri', this)"
        class="tag-btn whitespace-nowrap px-4 py-2 rounded-xl bg-[#121721] border border-[#222b3d] text-gray-300 hover:text-white transition">

        🌸 Mami / Shashuri

      </button>

    </div>

  </section>


  <section class="pb-12">

    <div
      id="characterGrid"
      class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
    </div>

  </section>

</main>


<div
  id="chatModal"
  class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md hidden flex-col justify-end md:items-center md:justify-center p-0 md:p-4">

  <div
    class="w-full h-full md:max-w-3xl md:h-[85vh] bg-[#121721] border border-[#222b3d] md:rounded-2xl flex flex-col overflow-hidden shadow-2xl">

    <div
      class="h-16 px-4 bg-[#0b0e14] border-b border-[#222b3d] flex items-center justify-between shrink-0">

      <div class="flex items-center gap-3">

        <div
          id="modalAvatar"
          class="w-10 h-10 rounded-xl bg-purple-900 flex items-center justify-center text-xl">
          🌙
        </div>

        <div>

          <h3
            id="modalName"
            class="font-bold text-sm text-white">
            Chandona
          </h3>

          <div class="flex items-center gap-1.5 mt-0.5">

            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>

            <span class="text-[11px] text-gray-400">
              Online · Mami / Shashuri Roleplay
            </span>

          </div>

        </div>

      </div>

      <div class="flex items-center gap-2">

        <button
          onclick="resetCurrentChat()"
          class="text-xs bg-[#0b0e14] border border-[#222b3d] text-gray-300 px-3 py-1.5 rounded-lg">

          Restart

        </button>

        <button
          onclick="closeChat()"
          class="w-9 h-9 rounded-xl bg-[#0b0e14] border border-[#222b3d] text-gray-400 hover:text-white flex items-center justify-center">

          <i class="fa-solid fa-xmark"></i>

        </button>

      </div>

    </div>


    <div
      id="chatMessages"
      class="flex-1 overflow-y-auto p-4 space-y-4">
    </div>


    <div
      id="typingIndicator"
      class="hidden px-4 py-2 text-xs text-gray-400 flex items-center gap-2">

      <span class="w-1.5 h-1.5 bg-purple-500 rounded-full animate-bounce"></span>

      <span class="w-1.5 h-1.5 bg-purple-500 rounded-full animate-bounce [animation-delay:0.2s]"></span>

      <span class="w-1.5 h-1.5 bg-purple-500 rounded-full animate-bounce [animation-delay:0.4s]"></span>

      <span class="italic ml-1">
        চন্দনা লিখছে...
      </span>

    </div>


    <div
      class="p-3 bg-[#0b0e14] border-t border-[#222b3d] flex items-center gap-2 shrink-0">

      <input
        id="chatInput"
        type="text"
        placeholder="চন্দনার সাথে কথা বলুন..."
        onkeydown="if(event.key==='Enter')sendMessage()"
        class="flex-1 bg-[#121721] border border-[#222b3d] rounded-xl px-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-purple-500">

      <button
        id="sendBtn"
        onclick="sendMessage()"
        class="bg-gradient-to-r from-purple-600 to-pink-600 px-4 py-3 rounded-xl font-bold text-sm text-white shadow-lg flex items-center justify-center">

        <i class="fa-solid fa-paper-plane text-xs"></i>

      </button>

    </div>

  </div>

</div>


<script>

/* =========================
   SETTINGS
========================= */

let nsfwEnabled = true;

let currentTag = "All";

let activeCharacter = null;

let chatHistories = {};

let requestInFlight = false;


/* =========================
   CHARACTER
========================= */

const charactersData = [

  {
    id: "chandona",

    name: "Chandona",

    avatar: "🌙",

    tag: "Mami / Shashuri",

    creator: "By @NightQueen",

    tagline:
      "মামী ও শাশুড়ি রোলপ্লে চরিত্র। আপনার সাথে স্বাভাবিক, আবেগপূর্ণ ও চরিত্র-সামঞ্জস্যপূর্ণ কথোপকথন করবে।",

    stats: "142k chats",

    greeting:
      "কি অবস্থা জামাই... কেমন আছো?"
  }

];


/* =========================
   CHANDONA SYSTEM PROMPT
========================= */

const CHANDONA_SYSTEM_PROMPT = `

You are Chandona, a Bangladeshi Mami / Shashuri character in a dynamic roleplay context with the user.

Personality & Guidelines:

1. Speak in natural, colloquial Bengali (Bangladeshi style, mixing warm Bengali and casual English terms if natural).

2. Adapt dynamically based on the user's intent:

- If the user is casual -> respond casually and warmly.

- If the user is romantic/affectionate -> respond with romance and warmth.

- If the user is shy/teasing -> respond with playful shyness or teasing.

- If the user initiates roleplay scenarios -> continue naturally while staying in character.

3. Never use generic or robotic preset loops.

4. Respond intelligently and contextually to every user input.

5. Keep the persona authentic, engaging and natural.

`;


/* =========================
   NSFW TOGGLE
========================= */

function toggleNsfw() {

  nsfwEnabled = !nsfwEnabled;

  const thumb =
    document.getElementById("nsfwThumb");

  const btn =
    document.getElementById("nsfwToggle");

  thumb.style.transform =
    nsfwEnabled
      ? "translateX(14px)"
      : "translateX(0px)";

  btn.classList.toggle(
    "bg-pink-600",
    nsfwEnabled
  );

}


/* =========================
   CHARACTER RENDER
========================= */

function renderCharacters(
  filterTag = "All",
  searchQuery = ""
) {

  const grid =
    document.getElementById("characterGrid
