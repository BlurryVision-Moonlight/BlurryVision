<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SpicyChat.ai — Web App</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0b0e14] text-gray-100 font-sans min-h-screen flex flex-col">

<!-- Top Navigation Bar -->
<header class="sticky top-0 z-40 bg-[#0b0e14]/90 backdrop-blur-md border-b border-[#222b3d] px-4 lg:px-8 h-16 flex items-center justify-between">
  <div class="flex items-center gap-4">
    <a href="#" class="text-xl font-black tracking-tight flex items-center gap-2">
      <span class="bg-gradient-to-r from-purple-500 to-pink-500 text-transparent bg-clip-text">SpicyChat</span>
      <span class="text-xs bg-purple-950 border border-purple-800 text-purple-300 px-2 py-0.5 rounded-full font-semibold">AI v3.0</span>
    </a>
  </div>

  <div class="flex items-center gap-3">
    <div class="flex items-center gap-1.5 bg-[#121721] border border-[#222b3d] px-2.5 py-1.5 rounded-full">
      <span class="text-[11px] font-bold text-pink-400 tracking-wider">NSFW</span>
      <button id="nsfwToggle" onclick="toggleNsfw()" class="w-8 h-4.5 bg-pink-600 rounded-full relative transition flex items-center px-0.5 cursor-pointer">
        <div id="nsfwThumb" class="w-3.5 h-3.5 bg-white rounded-full transition-transform transform translate-x-3.5"></div>
      </button>
    </div>
    <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-purple-600 to-pink-600 flex items-center justify-center font-bold text-xs text-white shadow">
      DF
    </div>
  </div>
</header>

<!-- Main Container -->
<main class="flex-1 max-w-7xl w-full mx-auto px-4 lg:px-8 py-6 flex flex-col gap-6">

  <!-- Header & Search -->
  <section class="flex flex-col gap-4">
    <div>
      <h1 class="text-2xl md:text-3xl font-black tracking-tight">Explore AI Characters</h1>
      <p class="text-sm text-gray-400 mt-1">Immerse yourself in dynamic, human-like conversations and multilingual roleplay.</p>
    </div>
    
    <div class="relative w-full">
      <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
      <input id="searchInput" type="text" placeholder="Search characters..." oninput="filterCharacters()" class="w-full bg-[#121721] border border-[#222b3d] rounded-xl pl-10 pr-4 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-purple-500 transition">
    </div>

    <!-- Tag Filters -->
    <div id="tagFilters" class="flex items-center gap-2 overflow-x-auto pb-2 text-xs font-semibold">
      <button onclick="filterByTag('All', this)" class="tag-btn whitespace-nowrap px-4 py-2 rounded-xl bg-purple-600 text-white transition shadow-sm">🔥 All</button>
      <button onclick="filterByTag('Mami / Shashuri', this)" class="tag-btn whitespace-nowrap px-4 py-2 rounded-xl bg-[#121721] border border-[#222b3d] text-gray-300 hover:text-white transition">🌸 Mami / Shashuri</button>
    </div>
  </section>

  <!-- Character Cards Grid -->
  <section class="pb-12">
    <div id="characterGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
  </section>

</main>

<!-- Chat Modal -->
<div id="chatModal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md hidden flex-col justify-end md:items-center md:justify-center p-0 md:p-4">
  <div class="w-full h-full md:max-w-3xl md:h-[85vh] bg-[#121721] border border-[#222b3d] md:rounded-2xl flex flex-col overflow-hidden shadow-2xl">
    
    <div class="h-16 px-4 bg-[#0b0e14] border-b border-[#222b3d] flex items-center justify-between shrink-0">
      <div class="flex items-center gap-3">
        <div id="modalAvatar" class="w-10 h-10 rounded-xl bg-purple-900 flex items-center justify-center text-xl">🌙</div>
        <div>
          <h3 id="modalName" class="font-bold text-sm text-white">Chandona</h3>
          <div class="flex items-center gap-1.5 mt-0.5">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span class="text-[11px] text-gray-400">Online · Mami / Shashuri Roleplay</span>
          </div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="resetCurrentChat()" class="text-xs bg-[#0b0e14] border border-[#222b3d] text-gray-300 px-3 py-1.5 rounded-lg">Restart</button>
        <button onclick="closeChat()" class="w-9 h-9 rounded-xl bg-[#0b0e14] border border-[#222b3d] text-gray-400 hover:text-white flex items-center justify-center">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </div>

    <div id="chatMessages" class="flex-1 overflow-y-auto p-4 space-y-4"></div>

    <div id="typingIndicator" class="hidden px-4 py-2 text-xs text-gray-400 flex items-center gap-2">
      <span class="w-1.5 h-1.5 bg-purple-500 rounded-full animate-bounce"></span>
      <span class="w-1.5 h-1.5 bg-purple-500 rounded-full animate-bounce [animation-delay:0.2s]"></span>
      <span class="w-1.5 h-1.5 bg-purple-500 rounded-full animate-bounce [animation-delay:0.4s]"></span>
      <span class="italic ml-1">চন্দনা লিখছে...</span>
    </div>

    <div class="p-3 bg-[#0b0e14] border-t border-[#222b3d] flex items-center gap-2 shrink-0">
      <input id="chatInput" type="text" placeholder="চন্দনার সাথে কথা বলুন..." onkeydown="if(event.key==='Enter')sendMessage()" class="flex-1 bg-[#121721] border border-[#222b3d] rounded-xl px-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-purple-500">
      <button onclick="sendMessage()" class="bg-gradient-to-r from-purple-600 to-pink-600 px-4 py-3 rounded-xl font-bold text-sm text-white shadow-lg flex items-center justify-center">
        <i class="fa-solid fa-paper-plane text-xs"></i>
      </button>
    </div>

  </div>
</div>

<script>
let nsfwEnabled = true;
let currentTag = 'All';
let activeCharacter = null;
let chatHistories = {};

const charactersData = [
  { 
    id: 'chandona', 
    name: 'Chandona', 
    avatar: '🌙', 
    tag: 'Mami / Shashuri', 
    creator: 'By @NightQueen', 
    tagline: 'মামী ও শাশুড়ি রোলপ্লে চরিত্র। আপনার সাথে মিষ্টি ও রোমান্টিক কথোপকথন করবে।', 
    stats: '142k chats', 
    greeting: "কি অবস্থা জামাই... কেমন আছো?", 
    
    // এক্সক্লুসিভ চন্দনা রোলপ্লে ডাটাবেজ (গ্রাফিক, রোমান্টিক, লজ্জা ও টিজিং ভাইব)
    roleplayStyles: {
      graphic: [
        "হিহি... এতো জলদি কাছে টানলে তো আমার বুকটা কেঁপে উঠবে জামাই! দরজাটা একটু ভালো করে ভিজিয়ে দাও তো দেখি... তারপর যা করতে চাও করো। 🔥❤️",
        "আহা সোনা... তোমার এই গরম নিঃশ্বাস আমার গায়ে লাগলে নিজেকে আর সামলাতে পারি না। এসো, আরো শক্ত করে জড়িয়ে ধরো আমাকে... 💋",
        "তুমি না বড় বেশি পাজি হয়ে গেছো! এই নিঝুম রাতে এভাবে মামীকে কাছে ডাকলে কি আর মানসম্মান থাকে বলো? তবুও তোমার বাহুডোরে থাকতে আমার বেশ লাগে... ✨"
      ],
      romantic: [
        "আহা সোনা... তোমার এই মিষ্টি কথাগুলো শুনলে আমার মনটা একদম জুড়িয়ে যায়। আরেকটু কাছে এসে বসো না আমার পাশে... ❤️",
        "তুমি জানো তো, তুমি ছাড়া আমার এই ঘর ভালোই লাগে না। সারাক্ষণ শুধু তোমার কথাই আমার মনে ঘুরপাক খায়। ✨",
        "চোখ বন্ধ করে একটু ভাবো তো জামাই, আমি ঠিক কীভাবে তোমাকে আগলে রাখি... কেমন ফিল হচ্ছে বলতো? 🌹"
      ],
      shry_teasing: [
        "ইশ! এভাবে তাকাচ্ছ কেন আমার দিকে? বড় লজ্জা করছে তো সোনা! চোখ নামাও বলছি... 🙈",
        "সারাদিন তো শুধু পাজিপনা করো! এখন আবার মামীকে কাছে ডাকছ কেন শুনি? দুষ্টু কোথাকার! 😉",
        "আমায় এভাবে দেখে লজ্জা পেয়ে যাচ্ছি তো! তুমি না বড় বেশি ডানপিটে হয়ে গেছো দিন দিন... 🖤"
      ],
      casual: [
        "বেশ তো! তোমার সাথে কথা বললেই আমার মনটা একদম প্রফুল্ল হয়ে যায়। বলো আজ তোমাকে কি বানিয়ে খাওয়াবো? 🌸",
        "সাবধানে থেকো সবসময়। আর হ্যাঁ, আমার কথা কিন্তু ভুললে চলবে না একদম! ✨",
        "তোমার এই মিষ্টি মুখটা দেখলে আমার সব ক্লান্তি নিমিষে দূর হয়ে যায় সোনা। বলো, আর কী খবর তোমার? 💕"
      ]
    }
  }
];

function toggleNsfw() {
  nsfwEnabled = !nsfwEnabled;
  const thumb = document.getElementById('nsfwThumb');
  const toggleBtn = document.getElementById('nsfwToggle');
  if (nsfwEnabled) {
    thumb.style.transform = 'translateX(14px)';
    toggleBtn.classList.add('bg-pink-600');
  } else {
    thumb.style.transform = 'translateX(0px)';
    toggleBtn.classList.remove('bg-pink-600');
  }
}

function renderCharacters(filterTag = 'All', searchQuery = '') {
  const grid = document.getElementById('characterGrid');
  if(!grid) return;
  grid.innerHTML = '';

  const filtered = charactersData.filter(char => {
    const matchesTag = filterTag === 'All' || char.tag === filterTag;
    const matchesSearch = char.name.toLowerCase().includes(searchQuery.toLowerCase()) || char.tag.toLowerCase().includes(searchQuery.toLowerCase());
    return matchesTag && matchesSearch;
  });

  filtered.forEach(char => {
    const card = document.createElement('div');
    card.className = 'bg-[#121721] border border-[#222b3d] hover:border-purple-500/50 rounded-2xl p-4 flex flex-col justify-between transition-all duration-300 shadow-lg group cursor-pointer';
    card.onclick = () => openChat(char.id);

    card.innerHTML = `
      <div>
        <div class="relative h-40 rounded-xl bg-gradient-to-br from-purple-950/60 to-[#0b0e14] flex items-center justify-center text-5xl mb-3 overflow-hidden border border-[#222b3d]/50">
          <span class="group-hover:scale-110 transition duration-300">${char.avatar}</span>
          <span class="absolute top-2.5 left-2.5 bg-black/60 text-[9px] font-bold text-purple-300 px-2 py-0.5 rounded-full border border-purple-500/30">Roleplay</span>
          <span class="absolute bottom-2.5 right-2.5 bg-black/60 text-[9px] text-gray-300 px-2 py-0.5 rounded-md font-semibold">${char.tag}</span>
        </div>
        <div class="flex items-center justify-between mb-1">
          <h3 class="font-bold text-sm text-white group-hover:text-purple-400 transition">${char.name}</h3>
          <span class="text-[10px] text-gray-500">${char.creator}</span>
        </div>
        <p class="text-xs text-gray-400 line-clamp-2 leading-relaxed mb-3">${char.tagline}</p>
      </div>
      <div class="flex items-center justify-between pt-2.5 border-t border-[#222b3d]/60 text-xs text-gray-500">
        <span class="font-medium">${char.stats}</span>
        <button class="bg-white text-[#0b0e14] hover:bg-purple-100 font-bold px-3 py-1 rounded-lg transition text-xs">Chat Now</button>
      </div>
    `;
    grid.appendChild(card);
  });
}

function filterByTag(tag, btn) {
  currentTag = tag;
  document.querySelectorAll('.tag-btn').forEach(b => {
    b.className = 'tag-btn whitespace-nowrap px-4 py-2 rounded-xl bg-[#121721] border border-[#222b3d] text-gray-300 hover:text-white transition';
  });
  btn.className = 'tag-btn whitespace-nowrap px-4 py-2 rounded-xl bg-purple-600 text-white transition shadow-sm';
  renderCharacters(currentTag, document.getElementById('searchInput').value);
}

function filterCharacters() {
  renderCharacters(currentTag, document.getElementById('searchInput').value);
}

function openChat(charId) {
  activeCharacter = charactersData.find(c => c.id === charId);
  if (!activeCharacter) return;

  document.getElementById('modalName').textContent = activeCharacter.name;
  document.getElementById('modalAvatar').textContent = activeCharacter.avatar;
  const modal = document.getElementById('chatModal');
  modal.classList.remove('hidden');
  modal.classList.add('flex');

  if (!chatHistories[charId]) {
    chatHistories[charId] = [{ sender: 'ai', text: activeCharacter.greeting }];
  }
  renderChatMessages();
}

function closeChat() {
  if('speechSynthesis' in window) speechSynthesis.cancel();
  const modal = document.getElementById('chatModal');
  modal.classList.remove('flex');
  modal.classList.add('hidden');
}

function resetCurrentChat() {
  if (!activeCharacter) return;
  chatHistories[activeCharacter.id] = [{ sender: 'ai', text: activeCharacter.greeting }];
  renderChatMessages();
}

function renderChatMessages() {
  const container = document.getElementById('chatMessages');
  if(!container) return;
  container.innerHTML = '';
  const history = chatHistories[activeCharacter.id] || [];

  history.forEach(msg => {
    const wrap = document.createElement('div');
    wrap.className = `flex flex-col ${msg.sender === 'user' ? 'items-end' : 'items-start'} mb-3`;

    if (msg.sender === 'user') {
      wrap.innerHTML = `<div class="max-w-[85%] bg-purple-600 text-white rounded-2xl rounded-br-sm px-3.5 py-2.5 text-xs md:text-sm leading-relaxed shadow-md">${escapeHtml(msg.text)}</div>`;
    } else {
      const msgId = 'tts_' + Math.random().toString(36).substring(2, 9);
      wrap.innerHTML = `
        <div class="max-w-[85%] bg-[#121721] border border-[#222b3d] text-gray-200 rounded-2xl rounded-bl-sm px-3.5 py-2.5 text-xs md:text-sm leading-relaxed shadow-md">${escapeHtml(msg.text)}</div>
        <div class="flex items-center gap-2 mt-1 ml-1">
          <button id="${msgId}" onclick="speakText('${escapeQuotes(msg.text)}', '${msgId}')" class="bg-[#0b0e14] border border-[#222b3d] hover:border-gray-600 text-gray-400 hover:text-white text-[11px] px-2.5 py-1 rounded-lg flex items-center gap-1.5 transition cursor-pointer">
            <i class="fa-solid fa-volume-high text-purple-400"></i>
            <span>Listen</span>
          </button>
        </div>
      `;
    }
    container.appendChild(wrap);
  });
  container.scrollTop = container.scrollHeight;
}

function sendMessage() {
  const input = document.getElementById('chatInput');
  if(!input) return;
  const text = input.value.trim();
  if (!text || !activeCharacter) return;

  chatHistories[activeCharacter.id].push({ sender: 'user', text: text });
  input.value = '';
  renderChatMessages();

  const typing = document.getElementById('typingIndicator');
  if(typing) typing.classList.remove('hidden');
  const container = document.getElementById('chatMessages');
  if(container) container.scrollTop = container.scrollHeight;

  setTimeout(() => {
    if(typing) typing.classList.add('hidden');
    const responseText = getSmartMamiReply(text, activeCharacter);
    chatHistories[activeCharacter.id].push({ sender: 'ai', text: responseText });
    renderChatMessages();
  }, 900);
}

// ইউজারের ইনপুট প্রসেস করে প্রাসঙ্গিক মামী/শাশুড়ি রোলপ্লে রেসপন্স দেওয়ার স্মার্ট লজিক
function getSmartMamiReply(userText, character) {
  const t = userText.toLowerCase();
  let category = 'casual';

  if (t.includes('kisu') || t.includes('kiss') || t.includes('raat') || t.includes('রাত') || t.includes('শরীর') || t.includes('কাছে আসো') || t.includes('জাপ্টে') || t.includes('কোমরে') || t.includes('দরজা')) {
    category = 'graphic';
  } else if (t.includes('ভালোবাসি') || t.includes('love') || t.includes('মন') || t.includes('priyo') || t.includes('রোমান্টিক')) {
    category = 'romantic';
  } else if (t.includes('লজ্জা') || t.includes('পাজি') || t.includes('দুষ্টু') || t.includes('mami') || t.includes('মামী')) {
    category = 'shry_teasing';
  } else {
    category = 'casual';
  }

  const list = character.roleplayStyles[category] || character.roleplayStyles.casual;
  return list[Math.floor(Math.random() * list.length)];
}

function speakText(text, btnId) {
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const btn = document.getElementById(btnId);
  
  document.querySelectorAll('button[id^="tts_"]').forEach(b => {
    b.innerHTML = '<i class="fa-solid fa-volume-high text-purple-400"></i><span>Listen</span>';
  });

  // থার্ড রুল: ইমোজি বা স্টারগুলো সম্পূর্ণ রিমুভ করা যাতে ভয়েস পড়ার সময় কোনোভাবেই উচ্চারণ না করে
  const cleanText = text.replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD10-\uDDFF])/g, '').trim();

  const utterance = new SpeechSynthesisUtterance(cleanText);
  
  // ফার্স্ট রুল: পার্মানেন্ট বাংলাদেশি ন্যাচারাল ফিমেল ভয়েস ফিল্টারিং
  const voices = speechSynthesis.getVoices();
  let selectedVoice = voices.find(v => (v.lang.toLowerCase().includes('bn') || v.lang.toLowerCase().includes('bangla')) && (v.name.toLowerCase().includes('female') || v.name.toLowerCase().includes('lekha') || v.name.toLowerCase().includes('tithi') || v.name.toLowerCase().includes('zira') || v.name.toLowerCase().includes('google বাংলা')));
  
  if (!selectedVoice) {
    selectedVoice = voices.find(v => v.lang.toLowerCase().includes('bn') || v.lang.toLowerCase().includes('bangla'));
  }
  if (!selectedVoice) {
    selectedVoice = voices.find(v => v.name.toLowerCase().includes('female'));
  }
  if (!selectedVoice && voices.length > 0) {
    selectedVoice = voices[0];
  }

  if (selectedVoice) {
    utterance.voice = selectedVoice;
    utterance.lang = selectedVoice.lang;
  } else {
    utterance.lang = 'bn-BD';
  }

  utterance.rate = 0.92;
  utterance.pitch = 1.18; // মিষ্টি ফিমেল হাসি ও এক্সপ্রেশন ফুটিয়ে তোলার জন্য পিচ টিউন করা

  if(btn) btn.innerHTML = '<i class="fa-solid fa-stop text-pink-400"></i><span>Stop</span>';

  utterance.onend = () => {
    if(btn) btn.innerHTML = '<i class="fa-solid fa-volume-high text-purple-400"></i><span>Listen</span>';
  };
  utterance.onerror = () => {
    if(btn) btn.innerHTML = '<i class="fa-solid fa-volume-high text-purple-400"></i><span>Listen</span>';
  };

  speechSynthesis.speak(utterance);
}

function escapeHtml(str) {
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

function escapeQuotes(str) {
  return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

renderCharacters();
</script>
</body>
</html>
